# Fly.io config. Deploy from this directory: `fly launch --copy-config` then `fly deploy`.
app = "monetary-rianfathany"
primary_region = "sin"

[build]

[env]
  MONETARY_DB = "/app/data/monetary.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/login"          # halaman publik, ikut memastikan database kebaca

[[mounts]]
  source = "monetary_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

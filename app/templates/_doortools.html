{# Sakelar bahasa + tema di pojok halaman pintu masuk; tombol kembali bila halaman mengisi `back`. #}
{% if back %}
<a class="ibtn door-tools door-back" href="{{ back }}" title="{{ _('Kembali') }}" aria-label="{{ _('Kembali') }}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
</a>
{% endif %}
<div class="door-top">
  {% include "_langtog.html" %}
  <button type="button" class="ibtn door-tools" id="theme-toggle" title="{{ _('Ganti tema terang/gelap') }}" aria-label="{{ _('Ganti tema') }}">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

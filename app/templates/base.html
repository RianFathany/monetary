<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monetary">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}Monetary{% endblock %}</title>
<script>try{var t=localStorage.getItem('monetary-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bebas+Neue&family=Outfit:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/vendor/tom-select.css">
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon.svg">
</head>
<body class="{% block bodyclass %}{% endblock %}">
{% block header %}
<header class="bar"><div class="barin">
  <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 18.5V8.2c0-.6.7-.9 1.1-.5L12 14.2l6.4-6.5c.4-.4 1.1-.1 1.1.5v10.3"/><path d="M8 18.5h8" opacity=".55"/><circle cx="12" cy="14.2" r="1.3" fill="currentColor" stroke="none"/></svg></span><span><b>Monetary</b><span class="sub">Kas masuk · keluar · dana darurat</span></span></a>
  <nav class="nav">
    <a href="/m/{{ mk if mk else today[:7] }}" class="{{ 'on' if page=='month' }}">Bulan</a>
    <a href="/overview" class="{{ 'on' if page=='overview' }}">Ringkasan</a>
    <a href="/assets" class="{{ 'on' if page=='assets' }}">Aset</a>
    <a href="/settings" class="{{ 'on' if page=='settings' }}">Setelan</a>
  </nav>
  <div class="tools">
    <button type="button" class="ibtn" id="theme-toggle" title="Ganti tema terang/gelap" aria-label="Ganti tema">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <a class="ibtn" href="/logout" title="Keluar" aria-label="Keluar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </a>
  </div>
</div></header>
{% endblock %}
<main class="wrap">{% block content %}{% endblock %}</main>
{% block fab %}{% endblock %}
<div class="toast" id="toast"></div>
<script src="/static/vendor/tom-select.complete.min.js"></script>
<script src="/static/app.js?v={{ asset_v }}"></script>
</body>
</html>

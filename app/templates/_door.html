{# Latar pintu masuk: klip sesuai waktu & cuaca, jam, lokasi. Dipakai halaman masuk & daftar. #}
<script>
// Pintu masuk — rule yang sama dengan rianfathany.com, dengan klip suasana kerja/keuangan (Pexels) menurut jam lokal,
// ganti ke klip hujan bila di lokasi pengguna (fallback Jakarta) sedang hujan.
// ?t=morning|day|dusk|night|rain memaksa slot tertentu.
(function () {
  var door = document.getElementById("door"), slotEl = document.getElementById("slot");
  var slots = {
    morning: { file: "morning", portrait: "morning-portrait", label: {{ _("pagi") | tojson }} },
    day:     { file: "day",     portrait: "day-portrait",     label: {{ _("siang") | tojson }} },
    dusk:    { file: "dusk",    portrait: "dusk-portrait",    label: {{ _("senja") | tojson }} },
    night:   { file: "night",   portrait: "night-portrait",   label: {{ _("malam") | tojson }} },
    rain:    { file: "rain",    portrait: "rain-portrait",    label: {{ _("hujan") | tojson }} }
  };
  var h = new Date().getHours();
  var timeKey = h >= 5 && h < 10 ? "morning" : h < 16 ? "day" : h < 19 ? "dusk" : "night";
  var q = new URLSearchParams(location.search).get("t");
  var forced = slots[q] ? q : null;
  var portrait = window.matchMedia("(orientation: portrait)").matches;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var saveData = navigator.connection && navigator.connection.saveData;
  var video = null;

  function apply(key) {
    var slot = slots[key];
    var base = "/static/video/" + (portrait && slot.portrait ? slot.portrait : slot.file);
    document.documentElement.setAttribute("data-slot", key);
    door.style.backgroundImage = "url(" + base + ".jpg?v={{ asset_v }})";
    slotEl.textContent = (key === "rain" ? slots[timeKey].label + " · " + {{ _("hujan") | tojson }} : slot.label);
    if (reduced || saveData) return;
    if (!video) {
      video = document.createElement("video");
      video.muted = true; video.loop = true; video.autoplay = true; video.playsInline = true;
      video.setAttribute("playsinline", ""); video.setAttribute("aria-hidden", "true"); video.preload = "auto";
      video.addEventListener("playing", function () { video.classList.add("ready"); });
      door.appendChild(video);
    }
    video.classList.remove("ready");
    video.poster = base + ".jpg?v={{ asset_v }}"; video.src = base + ".mp4?v={{ asset_v }}";
    var p = video.play(); if (p && p.catch) p.catch(function () {});
  }
  apply(forced || timeKey);
  if (forced) return;
  // Hujan sungguhan, hujan lokal, atau badai. Gerimis/kabut tetap klip biasa; malam tetap klip malam.
  var rainy = { 61:1, 63:1, 65:1, 66:1, 67:1, 80:1, 81:1, 82:1, 95:1, 96:1, 99:1 };
  window.addEventListener("monetary-weather", function (e) {
    if (timeKey !== "night" && rainy[e.detail.code]) apply("rain");
  });
})();

// Jam, cuaca, dan lokasi. Mulai dari Jakarta (tanpa izin), lalu bila pengguna mengizinkan lokasi,
// cuaca diambil di posisi sebenarnya dan nama kota dicari lewat reverse-geocode.
(function () {
  var live = document.getElementById("live"), clock = document.getElementById("clock"), place = document.getElementById("place"),
      wt = document.getElementById("wx-t"), ww = document.getElementById("wx-w");
  var loc = { lat: -6.2, lon: 106.8167, name: "Jakarta", tz: "Asia/Jakarta" };
  var fmt = null;
  function makeFmt() {
    var locale = {{ ("id-ID" if lang == "id" else "en-GB") | tojson }};
    try { fmt = new Intl.DateTimeFormat(locale, { timeZone: loc.tz, hour: "2-digit", minute: "2-digit", hour12: false }); }
    catch (e) { fmt = new Intl.DateTimeFormat(locale, { hour: "2-digit", minute: "2-digit", hour12: false }); }
  }
  function tick() { clock.textContent = fmt.format(new Date()).replace(".", ":"); live.hidden = false; }
  makeFmt(); tick(); setInterval(tick, 15000);

  var words = {{ {
    0: _("cerah"), 1: _("cerah berawan"), 2: _("berawan sebagian"), 3: _("mendung"), 45: _("berkabut"), 48: _("berkabut"),
    51: _("gerimis"), 53: _("gerimis"), 55: _("gerimis"), 56: _("gerimis"), 57: _("gerimis"),
    61: _("hujan ringan"), 63: _("hujan"), 65: _("hujan lebat"), 66: _("hujan"), 67: _("hujan"),
    71: _("salju"), 73: _("salju"), 75: _("salju"), 80: _("hujan lokal"), 81: _("hujan lokal"), 82: _("hujan deras"),
    95: _("badai petir"), 96: _("badai petir"), 99: _("badai petir")
  } | tojson }};
  function weather() {
    if (!window.fetch) return;
    fetch("https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon + "&current=temperature_2m,weather_code&timezone=auto")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.current) return;
        wt.textContent = Math.round(d.current.temperature_2m) + "°C";
        ww.textContent = words[d.current.weather_code] || "";
        if (d.timezone && d.timezone !== loc.tz) { loc.tz = d.timezone; makeFmt(); tick(); }
        window.dispatchEvent(new CustomEvent("monetary-weather", { detail: { code: d.current.weather_code } }));
      }).catch(function () {});
  }
  weather(); setInterval(weather, 30 * 60 * 1000);

  function reverseGeocode() {
    fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + loc.lat + "&longitude=" + loc.lon + "&localityLanguage={{ lang }}")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        var name = d.city || d.locality || d.principalSubdivision || d.countryName;
        if (name) { loc.name = name; place.textContent = name; }
      }).catch(function () {});
  }
  if (!navigator.geolocation || !window.isSecureContext) return;   // geolocation hanya jalan di https / localhost
  navigator.geolocation.getCurrentPosition(function (pos) {
    loc.lat = +pos.coords.latitude.toFixed(3); loc.lon = +pos.coords.longitude.toFixed(3);
    place.textContent = "…";
    weather(); reverseGeocode();
  }, function () {}, { timeout: 8000, maximumAge: 10 * 60 * 1000 });
})();
</script>

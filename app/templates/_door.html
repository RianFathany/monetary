{# Latar pintu masuk: klip sesuai waktu & cuaca, jam, lokasi. Dipakai halaman masuk & daftar. #}
<script>
// Pintu masuk — rule yang sama dengan rianfathany.com, dengan klip suasana kerja/keuangan (Pexels) menurut jam lokal,
// ganti ke klip hujan bila di lokasi pengguna (fallback Jakarta) sedang hujan.
// ?t=morning|day|dusk|night|rain memaksa slot tertentu.
(function () {
  var door = document.getElementById("door"), slotEl = document.getElementById("slot");
  var slots = {
    morning: { file: "morning", portrait: "morning-portrait", label: {{ _("pagi") | tojson }} },
    day:     { file: "day",     portrait: "day-portrait",     label: {{ _("siang") | tojson }} },
    dusk:    { file: "dusk",    portrait: "dusk-portrait",    label: {{ _("senja") | tojson }} },
    night:   { file: "night",   portrait: "night-portrait",   label: {{ _("malam") | tojson }} },
    rain:    { file: "rain",    portrait: "rain-portrait",    label: {{ _("hujan") | tojson }} }
  };
  var h = new Date().getHours();
  var timeKey = h >= 5 && h < 10 ? "morning" : h < 16 ? "day" : h < 19 ? "dusk" : "night";
  var q = new URLSearchParams(location.search).get("t");
  var forced = slots[q] ? q : null;
  var portrait = window.matchMedia("(orientation: portrait)").matches;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var saveData = navigator.connection && navigator.connection.saveData;
  var video = null;

  function apply(key) {
    var slot = slots[key];
    var base = "/static/video/" + (portrait && slot.portrait ? slot.portrait : slot.file);
    document.documentElement.setAttribute("data-slot", key);
    door.style.backgroundImage = "url(" + base + ".jpg?v={{ asset_v }})";
    slotEl.textContent = (key === "rain" ? slots[timeKey].label + " · " + {{ _("hujan") | tojson }} : slot.label);
    if (reduced || saveData) return;
    if (!video) {
      video = document.createElement("video");
      video.muted = true; video.loop = true; video.autoplay = true; video.playsInline = true;
      video.setAttribute("playsinline", ""); video.setAttribute("aria-hidden", "true"); video.preload = "auto";
      video.addEventListener("playing", function () { video.classList.add("ready"); });
      door.appendChild(video);
    }
    video.classList.remove("ready");
    video.poster = base + ".jpg?v={{ asset_v }}"; video.src = base + ".mp4?v={{ asset_v }}";
    var p = video.play(); if (p && p.catch) p.catch(function () {});
  }
  apply(forced || timeKey);
  if (forced) return;
  // Hujan sungguhan, hujan lokal, atau badai. Gerimis/kabut tetap klip biasa; malam tetap klip malam.
  var rainy = { 61:1, 63:1, 65:1, 66:1, 67:1, 80:1, 81:1, 82:1, 95:1, 96:1, 99:1 };
  window.addEventListener("monetary-weather", function (e) {
    if (timeKey !== "night" && rainy[e.detail.code]) apply("rain");
  });
})();
</script>
